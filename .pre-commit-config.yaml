repos:
  - repo: local
    hooks:
      # - id: ruff-lint
      #   name: ruff lint (fix)
      #   entry: poetry run ruff check --fix
      #   language: system
      #   types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: hadolint-check
        name: hadolint-check
        entry: hadolint Dockerfile
        language: system
        pass_filenames: false
      - id: yamlfmt
        name: yamlfmt
        entry: yamlfmt .
        language: system
        pass_filenames: false

